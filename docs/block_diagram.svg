<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -10 1560 720" width="1560" height="720" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f2328"/></marker></defs><rect x="-20" y="-10" width="1560" height="720" fill="#ffffff"/><text x="0" y="42.0" font-size="44" text-anchor="start" font-weight="bold" fill="#1f2328">prbviz: from antenna to browser</text><text x="0" y="96.0" font-size="24" text-anchor="start" font-weight="normal" fill="#57606a">nrscope taps the cell, server.py streams it to a browser.</text><rect x="300" y="190" width="864" height="430" rx="16" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6 5"/><text x="300" y="178.0" font-size="16" text-anchor="start" font-weight="bold" fill="#57606a">Host: Intel Core i5-13500H, 16 threads</text><text x="340" y="230.0" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2328">nrscope</text><rect x="0" y="238" width="160" height="120" rx="14" fill="#d6e6fb" stroke="#5b8fd1" stroke-width="2"/><text x="80.0" y="292.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f2328">USRP B210</text><text x="80.0" y="314.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f2328">RF front end</text><rect x="340" y="256" width="270" height="84" rx="14" fill="#d8f0d5" stroke="#5aa557" stroke-width="2"/><text x="475.0" y="292.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f2328">SSB sync, PBCH decode</text><text x="475.0" y="314.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f2328">MIB, SNR, RSRP, CFO</text><rect x="340" y="366" width="270" height="84" rx="14" fill="#d8f0d5" stroke="#5aa557" stroke-width="2"/><text x="475.0" y="402.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f2328">SIB1, RACH, DCI decode</text><text x="475.0" y="424.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f2328">RNTI, CCEs, MCS, RIV</text><rect x="340" y="476" width="270" height="84" rx="14" fill="#d8f0d5" stroke="#5aa557" stroke-width="2"/><text x="475.0" y="512.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f2328">Power taps</text><text x="475.0" y="534.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f2328">per PRB and per symbol</text><rect x="700" y="358" width="150" height="100" rx="40" fill="#ffffff" stroke="#8b949e" stroke-width="2"/><line x1="816" y1="368" x2="816" y2="448" stroke="#8b949e" stroke-width="1.5"/><text x="758.0" y="402.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f2328">ZeroMQ PUB</text><text x="758.0" y="424.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f2328">127.0.0.1:5556</text><rect x="930" y="328" width="210" height="160" rx="14" fill="#fde0c9" stroke="#d9915a" stroke-width="2"/><text x="1035.0" y="391.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f2328">server.py</text><text x="1035.0" y="413.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f2328">SUB, reorder by slot</text><text x="1035.0" y="435.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f2328">SSE relay, cell switch</text><rect x="1308" y="328" width="200" height="160" rx="14" fill="#e6dcf7" stroke="#8e6fc9" stroke-width="2"/><text x="1408.0" y="380.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f2328">Browser</text><text x="1408.0" y="402.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f2328">index.html canvas</text><text x="1408.0" y="424.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f2328">waterfall, PBCH panel,</text><text x="1408.0" y="446.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f2328">Signal block</text><path d="M160 298 H338" fill="none" stroke="#1f2328" stroke-width="2" marker-end="url(#a)"/><text x="249" y="286.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#57606a">IQ over USB 3</text><path d="M610 298 H655 V408 H698" fill="none" stroke="#1f2328" stroke-width="2" marker-end="url(#a)"/><path d="M610 408 H698" fill="none" stroke="#1f2328" stroke-width="2" marker-end="url(#a)"/><path d="M610 518 H655 V408 H698" fill="none" stroke="#1f2328" stroke-width="2" marker-end="url(#a)"/><path d="M850 408 H928" fill="none" stroke="#1f2328" stroke-width="2" marker-end="url(#a)"/><path d="M1140 408 H1306" fill="none" stroke="#1f2328" stroke-width="2" marker-end="url(#a)"/><text x="1223" y="396.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#57606a">SSE over HTTP :8080</text><text x="700" y="512.0" font-size="14" text-anchor="start" font-weight="normal" fill="#57606a">prb, sym: power per PRB, per symbol</text><text x="700" y="532.0" font-size="14" text-anchor="start" font-weight="normal" fill="#57606a">pbchc: PBCH constellation, MIB</text><text x="700" y="552.0" font-size="14" text-anchor="start" font-weight="normal" fill="#57606a">meas: SNR, RSRP, CFO</text><text x="700" y="572.0" font-size="14" text-anchor="start" font-weight="normal" fill="#57606a">dci: RNTI, CCEs, MCS, RIV</text><text x="1308" y="516.0" font-size="14" text-anchor="start" font-weight="normal" fill="#57606a">any device on the LAN</text><text x="300" y="660.0" font-size="14" text-anchor="start" font-weight="normal" fill="#57606a">scripts/start.sh starts server.py and nrscope (under nrscope_loop.sh, which restarts it if it exits).</text><text x="300" y="680.0" font-size="14" text-anchor="start" font-weight="normal" fill="#57606a">scripts/switch.sh retunes the B210 to another cell.</text></svg>
